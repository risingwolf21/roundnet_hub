<!DOCTYPE html>
<html lang="en" data-tenant="%VITE_WEBSITE_PATH%">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
  <meta name='viewport' content='width=device-width, viewport-fit=cover, initial-scale=1, user-scalable=no'>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="full-screen" content="yes">
  <meta name="browsermode" content="application">
  <meta name="screen-orientation" content="portrait">
  <meta name="theme-color" content="#000000" />
  <meta name="format-detection" content="telephone=no, email=no, address=no">

  <link rel="icon" href="/%VITE_ICON_PREFIX%/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/%VITE_ICON_PREFIX%/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="/%VITE_ICON_PREFIX%/favicon-96x96.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="/%VITE_ICON_PREFIX%/favicon-48x48.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/%VITE_ICON_PREFIX%/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/%VITE_ICON_PREFIX%/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/%VITE_ICON_PREFIX%/android-chrome-192x192.png" />

  <title>%VITE_WEBSITE_NAME%</title>


  <style>
    /* Start-up splash (shown before the JS bundle loads, reused by src/components/LoadingScreen.tsx).
       Colours fall back to the tenant's primary until global.css defines --primary. */
    html { --splash-fallback: oklch(0.5661 0.1131 168.53); }
    html[data-tenant="munich-roundnet"] { --splash-fallback: oklch(0.3392 0.1343 28.46); }

    .app-splash {
      --splash-accent: var(--primary, var(--splash-fallback));
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
      padding: 16px;
      background: radial-gradient(120% 80% at 50% 35%, color-mix(in oklch, var(--splash-accent) 12%, #fff) 0%, #fff 70%);
      font-family: 'Geist Variable', system-ui, -apple-system, sans-serif;
      transition: opacity .4s ease, transform .4s ease;
    }
    .app-splash--done { opacity: 0; transform: scale(1.04); pointer-events: none; }

    /* Stage = the icon's footprint. */
    .app-splash__stage {
      position: relative; width: 112px; height: 112px; margin: 24px 0;
      animation: splash-pop .6s cubic-bezier(.34,1.56,.64,1) both;
    }
    .app-splash__ring {
      position: absolute; inset: -12px; border-radius: 40px;
      border: 2px solid var(--splash-accent); opacity: 0;
      animation: splash-ring 2.4s ease-out infinite;
    }
    .app-splash__ring:nth-child(2) { animation-delay: 1.2s; }

    /* The icon breathes (shrinks and expands); the progress arc around it and the rings, which start
       at the progress arc in the icon's shape, breathe along. */
    .app-splash__icon { position: absolute; inset: 0; animation: splash-breathe 1.6s ease-in-out infinite; }
    .app-splash__logo {
      width: 100%; height: 100%; border-radius: 28px; object-fit: cover; background: #fff; display: block;
      box-shadow: 0 12px 32px -8px color-mix(in oklch, var(--splash-accent) 45%, transparent);
    }
    .app-splash__progress { position: absolute; inset: -12px; width: calc(100% + 24px); height: calc(100% + 24px); overflow: visible; }
    .app-splash__progress rect { fill: none; stroke-width: 4; }
    .app-splash__track { stroke: color-mix(in oklch, var(--splash-accent) 15%, transparent); }
    .app-splash__arc {
      stroke: var(--splash-accent); stroke-linecap: round; stroke-dasharray: 22 78;
      animation: splash-around 1.4s linear infinite;
    }

    .app-splash__name {
      margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .02em; color: #171717; text-align: center;
      animation: splash-rise .5s ease .35s both;
    }

    @keyframes splash-pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
    @keyframes splash-ring { 0% { opacity: .55; transform: scale(1); } 100% { opacity: 0; transform: scale(1.5); } }
    @keyframes splash-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(.86); } }
    @keyframes splash-around { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -100; } }
    @keyframes splash-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    @media (prefers-reduced-motion: reduce) {
      .app-splash * { animation: none !important; }
    }
  </style>

  <script type="module" src="/src/index.tsx"></script>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <!-- Outside #root: the stale service worker check below looks for an empty #root. -->
  <div id="splash" class="app-splash" role="status" aria-label="%VITE_WEBSITE_NAME%">
    <div class="app-splash__stage">
      <div class="app-splash__icon">
        <span class="app-splash__ring"></span>
        <span class="app-splash__ring"></span>
        <img class="app-splash__logo" src="/%VITE_ICON_PREFIX%/android-chrome-512x512.png" alt="" />
        <svg class="app-splash__progress" viewBox="0 0 136 136" aria-hidden="true">
          <rect class="app-splash__track" x="2" y="2" width="132" height="132" rx="38" pathLength="100" />
          <rect class="app-splash__arc" x="2" y="2" width="132" height="132" rx="38" pathLength="100" />
        </svg>
      </div>
    </div>
    <p class="app-splash__name">%VITE_WEBSITE_NAME%</p>
  </div>
  <div id="root"></div>
  <script>
    // If React never mounts (e.g. stale SW serving old chunk hashes that 404),
    // unregister the service worker and reload so the browser fetches fresh files.
    window.addEventListener('DOMContentLoaded', function () {
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && !root.hasChildNodes() && 'serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { r.unregister(); });
            window.location.reload();
          });
        }
      }, 4000);
    });
  </script>
</body>

</html>
