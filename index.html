<!DOCTYPE html>
<html lang="en" data-tenant="%VITE_WEBSITE_PATH%">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
  <meta name='viewport' content='width=device-width, viewport-fit=cover, initial-scale=1, user-scalable=no'>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="full-screen" content="yes">
  <meta name="browsermode" content="application">
  <meta name="screen-orientation" content="portrait">
  <meta name="theme-color" content="#000000" />
  <meta name="format-detection" content="telephone=no, email=no, address=no">

  <link rel="icon" href="/%VITE_ICON_PREFIX%/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/%VITE_ICON_PREFIX%/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="/%VITE_ICON_PREFIX%/favicon-96x96.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="/%VITE_ICON_PREFIX%/favicon-48x48.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/%VITE_ICON_PREFIX%/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/%VITE_ICON_PREFIX%/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/%VITE_ICON_PREFIX%/android-chrome-192x192.png" />

  <title>%VITE_WEBSITE_NAME%</title>


  <style>
    /* Start-up splash (shown before the JS bundle loads, reused by src/components/LoadingScreen.tsx).
       Colours fall back to the tenant's primary until global.css defines --primary. */
    html { --splash-fallback: oklch(0.5661 0.1131 168.53); }
    html[data-tenant="munich-roundnet"] { --splash-fallback: oklch(0.3392 0.1343 28.46); }

    .app-splash {
      --splash-accent: var(--primary, var(--splash-fallback));
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
      padding: 16px;
      background: radial-gradient(120% 80% at 50% 35%, color-mix(in oklch, var(--splash-accent) 12%, #fff) 0%, #fff 70%);
      font-family: 'Geist Variable', system-ui, -apple-system, sans-serif;
      transition: opacity .4s ease, transform .4s ease;
    }
    .app-splash--done { opacity: 0; transform: scale(1.04); pointer-events: none; }

    .app-splash__stage { position: relative; width: 112px; height: 112px; animation: splash-pop .6s cubic-bezier(.34,1.56,.64,1) both; }
    .app-splash__ring {
      position: absolute; inset: 0; border-radius: 32px;
      border: 2px solid var(--splash-accent); opacity: 0;
      animation: splash-ring 2.4s ease-out infinite;
    }
    .app-splash__ring:nth-child(2) { animation-delay: 1.2s; }
    .app-splash__logo {
      position: relative; width: 100%; height: 100%; border-radius: 28px; object-fit: cover; background: #fff;
      box-shadow: 0 12px 32px -8px color-mix(in oklch, var(--splash-accent) 45%, transparent);
      animation: splash-float 3s ease-in-out .6s infinite;
    }

    /* A roundnet ball bouncing on the net. */
    .app-splash__court { position: relative; width: 120px; height: 72px; animation: splash-fade .5s ease .25s both; }
    .app-splash__ball {
      position: absolute; left: 50%; bottom: 14px; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff 0 12%, color-mix(in oklch, var(--splash-accent) 60%, #ffd23f) 45%, color-mix(in oklch, var(--splash-accent) 80%, #000) 100%);
      animation: splash-bounce 1.1s cubic-bezier(.45,0,.55,1) infinite;
    }
    .app-splash__net {
      position: absolute; left: 50%; bottom: 0; width: 96px; height: 22px; margin-left: -48px; border-radius: 50%;
      border: 3px solid var(--splash-accent);
      background: repeating-linear-gradient(45deg, color-mix(in oklch, var(--splash-accent) 18%, transparent) 0 2px, transparent 2px 7px),
                  repeating-linear-gradient(-45deg, color-mix(in oklch, var(--splash-accent) 18%, transparent) 0 2px, transparent 2px 7px);
      animation: splash-net 1.1s ease-in-out infinite;
    }
    .app-splash__shadow {
      position: absolute; left: 50%; bottom: 7px; width: 22px; height: 6px; margin-left: -11px; border-radius: 50%;
      background: color-mix(in oklch, var(--splash-accent) 35%, transparent); z-index: 1;
      animation: splash-shadow 1.1s cubic-bezier(.45,0,.55,1) infinite;
    }
    .app-splash__ball { z-index: 2; }

    .app-splash__name {
      margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .02em; color: #171717; text-align: center;
      animation: splash-rise .5s ease .35s both;
    }
    .app-splash__bar {
      position: relative; width: 120px; height: 3px; overflow: hidden; border-radius: 3px; margin-top: -16px;
      background: color-mix(in oklch, var(--splash-accent) 15%, transparent);
      animation: splash-fade .5s ease .45s both;
    }
    .app-splash__bar::after {
      content: ''; position: absolute; inset: 0; width: 40%; border-radius: 3px; background: var(--splash-accent);
      animation: splash-slide 1.4s ease-in-out infinite;
    }

    @keyframes splash-pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
    @keyframes splash-ring { 0% { opacity: .55; transform: scale(.9); } 100% { opacity: 0; transform: scale(1.6); } }
    @keyframes splash-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes splash-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes splash-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes splash-bounce {
      0%, 100% { transform: translateY(0) scale(1.15, .85); }
      12%, 88% { transform: translateY(-6px) scale(.95, 1.05); }
      50% { transform: translateY(-50px) scale(1); }
    }
    @keyframes splash-shadow { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(.45); opacity: .35; } }
    @keyframes splash-net { 0%, 100% { transform: scaleY(.82) translateY(2px); } 12%, 88% { transform: scaleY(1); } }
    @keyframes splash-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }

    @media (prefers-reduced-motion: reduce) {
      .app-splash *, .app-splash *::after { animation: none !important; }
    }
  </style>

  <script type="module" src="/src/index.tsx"></script>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <!-- Outside #root: the stale service worker check below looks for an empty #root. -->
  <div id="splash" class="app-splash" role="status" aria-label="%VITE_WEBSITE_NAME%">
    <div class="app-splash__stage">
      <span class="app-splash__ring"></span>
      <span class="app-splash__ring"></span>
      <img class="app-splash__logo" src="/%VITE_ICON_PREFIX%/android-chrome-512x512.png" alt="" />
    </div>
    <div class="app-splash__court" aria-hidden="true">
      <span class="app-splash__net"></span>
      <span class="app-splash__shadow"></span>
      <span class="app-splash__ball"></span>
    </div>
    <p class="app-splash__name">%VITE_WEBSITE_NAME%</p>
    <span class="app-splash__bar" aria-hidden="true"></span>
  </div>
  <div id="root"></div>
  <script>
    // If React never mounts (e.g. stale SW serving old chunk hashes that 404),
    // unregister the service worker and reload so the browser fetches fresh files.
    window.addEventListener('DOMContentLoaded', function () {
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && !root.hasChildNodes() && 'serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { r.unregister(); });
            window.location.reload();
          });
        }
      }, 4000);
    });
  </script>
</body>

</html>
