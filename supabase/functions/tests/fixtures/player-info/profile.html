<!DOCTYPE html>
<!-- Trimmed copy of a playerzone profile page (markup as of 2026-11-21), personal data replaced. -->
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta property="og:title" content="Max Muster | RG Playerzone" />
</head>
<body>
<div class="rg-player-profile">
    <div class="rg-player-profile--main">
<div class="rg-player-profile--avatar">
    <div class="rg-player-profile--avatar-box">
        <img class="rg-player-profile--image"
             src="https://pstaassets.blob.core.windows.net/assets/players/profile_MAX1234-2024-03-01-10-00-00.jpg">
    </div>
</div>
        <div class="rg-player-profile--details">
            <div class="rg-player-profile--details-top">
                <span class="rg-player-profile--title">Max Muster</span>
                    <a class="rg-player-profile--club"
                       href="/clubs/roundnet-example">
                        <img class="rg-player-profile--club-logo" src="https://pstaassets.blob.core.windows.net/assets/clubs/logos/example.png">
                        Roundnet Example
                    </a>
                <div class="rg-player-profile--rgx">
        <a href="#elo-history"
           class="modal-trigger"
           onclick="show_history(1234)" >
        <rg-score-badge score="1532" logo-src="https://pstaassets.blob.core.windows.net/staticfiles/ranking/images/rgx_small.png" pro-logo-src="https://pstaassets.blob.core.windows.net/staticfiles/ranking/images/rgxpro_small.png">
        </rg-score-badge>
        </a>
                </div>
            </div>
            <div class="rg-player-profile--details-bottom">
            </div>
        </div>
    </div>
</div>

<!-- Further down the page: a teammate's photo and rating, which must not be read as this player's. -->
<div class="rg-player-tournaments">
    <img class="rg-player-profile--image" src="https://pstaassets.blob.core.windows.net/assets/players/profile_ANN42-2023-01-01-00-00-00.jpg">
    <rg-score-badge score="999"></rg-score-badge>
</div>
</body>
</html>
