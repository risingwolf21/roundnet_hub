name: Backup

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Choose wich environment you would like to backup'
        required: true
        default: All
        type: choice
        options:
          - Munich Roundnet
          - Roundnet Karlsruhe
          - All
  schedule:
    - cron: '0 0 */3 * *' # Runs every day at midnight
jobs:
  backup-karlsruhe:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch'
        || github.event.inputs.publish == 'All'
        || github.event.inputs.publish == 'Roundnet Karlsruhe' }}
    environment:
      name: 'Roundnet Karlsruhe'
    permissions:
      contents: write
    env:
      supabase_connection_string: ${{ vars.SUPABASE_CONNECTION_STRING }} # For example: postgresql://postgres:[YOUR-PASSWORD]@db.<ref>.supabase.co:5432/postgres
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Full Backup (roles, schema & data)
        run: supabase db dump --db-url "$supabase_connection_string" -f supabase/backup/roundnet-karlsruhe/full_dump.sql
      - name: Backup roles
        run: supabase db dump --db-url "$supabase_connection_string" -f supabase/backup/roundnet-karlsruhe/roles.sql --role-only
      - name: Backup schema
        run: supabase db dump --db-url "$supabase_connection_string" -f supabase/backup/roundnet-karlsruhe/schema.sql
      - name: Backup data
        run: supabase db dump --db-url "$supabase_connection_string" -f supabase/backup/roundnet-karlsruhe/data.sql --data-only --use-copy

      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Supabase Backup Roundnet Karlsruhe $(date +'%Y-%m-%d')"
          file_pattern: supabase/backup/roundnet-karlsruhe/*

  backup-munich:
    if: ${{ github.event_name != 'workflow_dispatch'
        || github.event.inputs.publish == 'All'
        || github.event.inputs.publish == 'Munich Roundnet' }}
    runs-on: ubuntu-latest
    environment:
      name: 'Munich Roundnet'
    permissions:
      contents: write
    env:
      supabase_connection_string: ${{ vars.SUPABASE_CONNECTION_STRING }} # For example: postgresql://postgres:[YOUR-PASSWORD]@db.<ref>.supabase.co:5432/postgres
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Full Backup (roles, schema & data)
        run: supabase db dump --db-url "$supabase_connection_string" -f supabase/backup/munich-roundnet/full_dump.sql
      - name: Backup roles
        run: supabase db dump --db-url "$supabase_connection_string" -f supabase/backup/munich-roundnet/roles.sql --role-only
      - name: Backup schema
        run: supabase db dump --db-url "$supabase_connection_string" -f supabase/backup/munich-roundnet/schema.sql
      - name: Backup data
        run: supabase db dump --db-url "$supabase_connection_string" -f supabase/backup/munich-roundnet/data.sql --data-only --use-copy

      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Supabase Backup $(date +'%Y-%m-%d')"
          file_pattern: supabase/backup/munich-roundnet/*
