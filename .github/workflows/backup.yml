name: Backup

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Choose wich environment you would like to backup"
        required: true
        default: All
        type: choice
        options:
          - Munich Roundnet
          - Roundnet Karlsruhe
          - All
  schedule:
    - cron: "0 0 */3 * *" # Runs every day at midnight

jobs:
  backup-karlsruhe:
    name: Backup Roundnet Karlsruhe
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch'
      || github.event.inputs.publish == 'All'
      || github.event.inputs.publish == 'Roundnet Karlsruhe' }}
    environment: "Roundnet Karlsruhe"
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump Karlsruhe (full/roles/schema/data)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_CONNECTION_STRING }} # For example: postgresql://postgres:[YOUR-PASSWORD]@db.<ref>.supabase.co:5432/postgres
        run: |
          mkdir -p out/roundnet-karlsruhe
          supabase db dump --db-url "$SUPABASE_DB_URL" -f out/roundnet-karlsruhe/full_dump.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f out/roundnet-karlsruhe/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f out/roundnet-karlsruhe/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f out/roundnet-karlsruhe/data.sql --data-only --use-copy

      - name: Upload artifact (Karlsruhe)
        uses: actions/upload-artifact@v4
        with:
          name: backup-karlsruhe
          path: out/roundnet-karlsruhe/*
          retention-days: 1

  backup-munich:
    name: Backup Munich Roundnet
    if: ${{ github.event_name != 'workflow_dispatch'
      || github.event.inputs.publish == 'All'
      || github.event.inputs.publish == 'Munich Roundnet' }}
    runs-on: ubuntu-latest
    environment: "Munich Roundnet"
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump Munich (full/roles/schema/data)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_CONNECTION_STRING }} # For example: postgresql://postgres:[YOUR-PASSWORD]@db.<ref>.supabase.co:5432/postgres
        run: |
          mkdir -p out/munich-roundnet
          supabase db dump --db-url "$SUPABASE_DB_URL" -f out/munich-roundnet/full_dump.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f out/munich-roundnet/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f out/munich-roundnet/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f out/munich-roundnet/data.sql --data-only --use-copy

      - name: Upload artifact (Munich)
        uses: actions/upload-artifact@v4
        with:
          name: backup-munich
          path: out/munich-roundnet/*
          retention-days: 1

  commit:
    name: Commit backups (single commit)
    runs-on: ubuntu-latest
    needs:
      - backup-karlsruhe
      - backup-munich
    # Mindestens ein Backup muss gelaufen sein (success) – sonst skippen
    if: ${{ needs.backup-karlsruhe.result == 'success' || needs.backup-munich.result == 'success' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact Karlsruhe
        if: ${{ needs.backup-karlsruhe.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: backup-karlsruhe
          path: stage/roundnet-karlsruhe

      - name: Download artifact Munich
        if: ${{ needs.backup-munich.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: backup-munich
          path: stage/munich-roundnet

      - name: Move files into repo paths
        run: |
          mkdir -p supabase/backup/roundnet-karlsruhe supabase/backup/munich-roundnet
          if [ -d "stage/roundnet-karlsruhe" ]; then
            cp -R stage/roundnet-karlsruhe/* supabase/backup/roundnet-karlsruhe/ || true
          fi
          if [ -d "stage/munich-roundnet" ]; then
            cp -R stage/munich-roundnet/* supabase/backup/munich-roundnet/ || true
          fi

      - name: Set DATE env (Europe/Berlin)
        run: echo "DATE=$(TZ=Europe/Berlin date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Determine CHOICE for commit message
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            choice="${{ github.event.inputs.publish }}"
          else
            choice="All"
          fi
          echo "CHOICE=$choice" >> $GITHUB_ENV

      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "📦 Supabase Backup (${{ env.CHOICE }}) ${{ env.DATE }}"
          file_pattern: |
            supabase/backup/roundnet-karlsruhe/*
            supabase/backup/munich-roundnet/*

      - uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            backup-karlsruhe
            backup-munich
