name: Staging
"on":
  push:
    branches:
      - staging
env:
  CI: ""

jobs:
  setup:
    name: "Setup"
    runs-on: ubuntu-latest
    environment:
      name: "Roundnet Karlsruhe Staging"
    steps:
      - uses: actions/checkout@v2

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Cache node_modules
        uses: actions/cache@v3^
        with:
          path: |
            node_modules
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

  db-test:
    name: "Test database"
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v3
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - run: supabase test db
      - run: supabase db lint --schema public,util,notificiations,games --fail-on error

  build-karlsruhe:
    name: "Build Karlsruhe Staging"
    runs-on: ubuntu-latest
    needs: db-test
    environment:
      name: "Roundnet Karlsruhe Staging"
      url: ${{ vars.PUBLIC_URL }}

    steps:
      - uses: actions/checkout@v2

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - name: Restore node_modules cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Build
        run: yarn run build:karlsruhe-stg
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_DB_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          VITE_OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VITE_PAYPAL_ME_LINK: ${{ vars.PAYPAL_ME_LINK }}
          VITE_PAYMENT_INFO: ${{ vars.PAYMENT_INFO }}
          VITE_GIT_COMMIT: ${{ github.sha}}
          VITE_ENV: "staging"

      - uses: actions/upload-artifact@v4
        with:
          name: "${{ vars.WEBSITE_PATH }}-build"
          path: ${{github.workspace}}/build

  deploy-karlsruhe:
    runs-on: ubuntu-latest
    needs: build-karlsruhe
    name: "Deploy Karlsruhe Staging"
    environment:
      name: "Roundnet Karlsruhe Staging"
      url: ${{ vars.PUBLIC_URL }}

    steps:
      - uses: actions/checkout@v2

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - uses: actions/download-artifact@v4
        with:
          name: "${{ vars.WEBSITE_PATH }}-build"
          path: ${{github.workspace}}/build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROUNDNET_KARLSRUHE }}"
          channelId: live
          projectId: ${{ vars.FIREBASE_PROJECT }}
          target: ${{ vars.FIREBASE_TARGET }}

  cleanup-artifact-karlsruhe:
    name: "Cleanup Artifacts Karlsruhe"
    runs-on: ubuntu-latest
    needs: [deploy-karlsruhe]
    environment: "Roundnet Karlsruhe Staging"
    steps:
      - uses: actions/checkout@v2

      - name: Delete build artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            ${{ vars.WEBSITE_PATH }}-build
