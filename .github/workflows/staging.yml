name: Staging
'on':
  workflow_dispatch:
    inputs:
      publish:
        description: 'Choose wich environment you would like to publish to staging'
        required: true
        default: All
        type: choice
        options:
          - Munich Roundnet
          - Roundnet Karlsruhe
          - All
  push:
    branches:
      - staging
env:
  CI: ''

jobs:
  setup:
    name: 'Setup'
    runs-on: ubuntu-latest
    environment:
      name: 'Roundnet Karlsruhe'
    steps:
      - uses: actions/checkout@v2

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-


  build-karlsruhe:
    name: 'Build Karlsruhe Staging'
    runs-on: ubuntu-latest
    needs: setup
    environment:
      name: 'Roundnet Karlsruhe Staging'
      url: ${{ vars.PUBLIC_URL }}

    steps:
      - uses: actions/checkout@v2

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - name: Restore node_modules cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Set short git commit
        id: vars
        run: echo "$GITHUB_SHA_SHORT=$(git rev-parse --short ${{ github.sha }})"

      - name: Build
        run: yarn run build:karlsruhe-stg
        env:
          VITE_SUPABASE_URL:          ${{ vars.SUPABASE_DB_URL }}
          VITE_SUPABASE_ANON_KEY:     ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID:   ${{ vars.SUPABASE_PROJECT_ID }}
          VITE_OPENWEATHER_API_KEY:   ${{ secrets.OPENWEATHER_API_KEY }}
          VITE_VAPID_PUBLIC_KEY:      ${{ vars.VAPID_PUBLIC_KEY }}
          VITE_PAYPAL_ME_LINK:        ${{ vars.PAYPAL_ME_LINK }}
          VITE_GIT_COMMIT:            ${{ steps.vars.outputs.sha_short }}

      - uses: actions/upload-artifact@v4
        with:
          name: '${{ vars.WEBSITE_PATH }}-build'
          path: ${{github.workspace}}/build

  deploy-karlsruhe:
    runs-on: ubuntu-latest
    needs: build-karlsruhe
    name: 'Deploy Karlsruhe'

    environment:
      name: 'Roundnet Karlsruhe Staging'
      url:  ${{ vars.PUBLIC_URL }}

    steps:
      - uses: actions/checkout@v2

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - uses: actions/download-artifact@v4
        with:
          name: '${{ vars.WEBSITE_PATH }}-build'
          path: ${{github.workspace}}/build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROUNDNET_KARLSRUHE }}'
          channelId: live
          projectId: ${{ vars.FIREBASE_PROJECT }}
          target: ${{ vars.FIREBASE_TARGET }}
