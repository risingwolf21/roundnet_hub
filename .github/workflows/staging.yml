name: Staging
'on':
  push:
    branches:
      - staging
env:
  CI: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env:
          - name: 'Roundnet Karlsruhe'
            firebase_target: staging
            firebase_project: roundnet-karlsruhe
            firebase_url: https://staging-roundnet-karlsruhe.web.app
            website_path: roundnet-karlsruhe
            website_manifest: manifest-roundnet-karlsruhe.json
            supabase_url_secret: STAGING_DB_URL
            supabase_key_secret: STAGING_ANON_KEY
            openweather_api_key: OPENWEATHER_API_KEY
            supabase_project_id: PROJECT_ID
            vapid_public_key: VAPID_PUBLIC_STAGING_KEY

    environment:
      name: ${{ matrix.env.name }}
      url: ${{ matrix.env.firebase_url }}

    steps:
      - uses: actions/checkout@v2

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: yarn install

      - name: Write commit Version to file
        uses: DamianReeves/write-file-action@master
        with:
          path: ${{github.workspace}}/public/git_commit.txt
          contents: |
            ${{github.sha}}
          write-mode: overwrite

      - name: Build
        run: yarn run build:staging
        env:
          PUBLIC_URL: ${{ matrix.env.firebase_url }}
          REACT_APP_PUBLIC_URL: ${{ matrix.env.firebase_url }}
          REACT_APP_SUPABASE_API_KEY: ${{ secrets[matrix.env.supabase_key_secret] }}
          REACT_APP_SUPABASE_URL: ${{ vars[matrix.env.supabase_url_secret] }}
          REACT_APP_WEBSITE_PATH: ${{ matrix.env.website_path }}
          REACT_APP_MANIFEST_JSON: ${{ matrix.env.website_manifest }}
          REACT_APP_WEBSITE_NAME: ${{ matrix.env.name }}
          REACT_APP_OPENWEATHER_API_KEY: ${{secrets[matrix.env.openweather_api_key]}}
          REACT_APP_SUPABASE_PROJECT_ID: ${{ vars[matrix.env.supabase_project_id] }}
          REACT_APP_VAPID_PUBLIC_KEY: ${{ vars[matrix.env.vapid_public_key] }}

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROUNDNET_KARLSRUHE }}'
          channelId: live
          projectId: ${{ matrix.env.firebase_project }}
          target: ${{ matrix.env.firebase_target }}
