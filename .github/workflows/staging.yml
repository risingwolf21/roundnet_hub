name: Staging
'on':
  workflow_dispatch:
    inputs:
      publish:
        description: 'Choose wich environment you would like to publish to staging'
        required: true
        default: All
        type: choice
        options:
          - Roundnet Karlsruhe Staging
          - All
  push:
    branches:
      - staging
env:
  CI: ''

jobs:
  setup:
    name: 'Setup'
    runs-on: ubuntu-latest
    environment:
      name: 'Roundnet Karlsruhe Staging'
    steps:
      - uses: actions/checkout@v2

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

  db-test:
    name: "Test database"
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v3
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - run: supabase test db
      - name: Verify generated types match Postgres schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
        run: |
          yarn gen-types:staging
          if ! git diff --ignore-space-at-eol --exit-code --quiet src/types/supabase-generated.types.ts; then
            echo "Detected uncommitted changes after build. See status below:"
            git diff
            exit 1
          fi

  build-karlsruhe:
    name: 'Build Karlsruhe Staging'
    if: ${{ github.event_name != 'workflow_dispatch'
        || github.event.inputs.publish == 'All'
        || github.event.inputs.publish == 'Roundnet Karlsruhe Staging' }}
    runs-on: ubuntu-latest
    needs: db-test
    environment:
      name: 'Roundnet Karlsruhe Staging'
      url: ${{ vars.PUBLIC_URL }}

    steps:
      - uses: actions/checkout@v2

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - name: Restore node_modules cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Verify generated custom types match Postgres schema
        env:
          VITE_SUPABASE_URL:      ${{ vars.SUPABASE_DB_URL }}
          VITE_SUPABASE_API_KEY:  ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          yarn gen-types:custom
          if ! git diff --ignore-space-at-eol --exit-code --quiet scripts/generate-types.ts; then
            echo "Detected uncommitted changes after build. See status below:"
            git diff
            exit 1
          fi

      - name: Build
        run: yarn run build:karlsruhe-stg
        env:
          VITE_SUPABASE_URL:          ${{ vars.SUPABASE_DB_URL }}
          VITE_SUPABASE_ANON_KEY:     ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID:   ${{ vars.SUPABASE_PROJECT_ID }}
          VITE_OPENWEATHER_API_KEY:   ${{ secrets.OPENWEATHER_API_KEY }}
          VITE_VAPID_PUBLIC_KEY:      ${{ vars.VAPID_PUBLIC_KEY }}
          VITE_PAYPAL_ME_LINK:        ${{ vars.PAYPAL_ME_LINK }}
          VITE_GIT_COMMIT:            ${{ github.sha}}
          VITE_ENV:                   'staging'

      - uses: actions/upload-artifact@v4
        with:
          name: '${{ vars.WEBSITE_PATH }}-build'
          path: ${{github.workspace}}/build

  deploy-karlsruhe:
    runs-on: ubuntu-latest
    needs: build-karlsruhe
    if: ${{ github.event_name != 'workflow_dispatch'
        || github.event.inputs.publish == 'All'
        || github.event.inputs.publish == 'Roundnet Karlsruhe Staging' }}
    name: 'Deploy Karlsruhe Staging'
    environment:
      name: 'Roundnet Karlsruhe Staging'
      url:  ${{ vars.PUBLIC_URL }}

    steps:
      - uses: actions/checkout@v2

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - uses: actions/download-artifact@v4
        with:
          name: '${{ vars.WEBSITE_PATH }}-build'
          path: ${{github.workspace}}/build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROUNDNET_KARLSRUHE }}'
          channelId: live
          projectId: ${{ vars.FIREBASE_PROJECT }}
          target: ${{ vars.FIREBASE_TARGET }}