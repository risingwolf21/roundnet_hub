name: Playwright tests

on:
  push:
    branches: [ master, production ]
  pull_request:
    branches: [ master, production ]

jobs:
  playwright-tests:
    name: "E2E (Playwright, non-blocking)"
    # Pinned: ubuntu-latest is now 26.04, which Playwright 1.59's `install --with-deps`
    # cannot provision system deps for ("does not support chromium on ubuntu26.04-x64").
    runs-on: ubuntu-24.04
    # Informational only: e2e is still being stabilised, so a failure here must never
    # block a merge. The uploaded report shows what passed/failed.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Local Supabase stack (same proven steps as the db-test job). Brings up the DB,
      # auth (GoTrue) and API gateway on :54321 that the app and the specs talk to.
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start --ignore-health-check

      - name: Export local stack env for app + tests
        run: |
          supabase status -o env > .supabase-status.env
          set -a; . ./.supabase-status.env; set +a
          {
            echo "VITE_SUPABASE_URL=${API_URL}"
            echo "SUPABASE_URL=${API_URL}"
            echo "VITE_SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "VITE_SUPABASE_PROJECT_ID=local"
            echo "VITE_WEBSITE_NAME=Roundnet Karlsruhe"
            echo "VITE_WEBSITE_PATH=roundnet-karlsruhe"
            echo "VITE_ICON_PREFIX=roundnet-karlsruhe"
            echo "VITE_ENV=development"
            echo "TEST_USER_PASSWORD=password"
            echo "BASE_URL=http://localhost:5173"
          } >> "$GITHUB_ENV"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # playwright.config.ts starts the Vite dev server (yarn start) itself via webServer.
      - name: Run Playwright tests
        run: npx playwright test --reporter=list

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
