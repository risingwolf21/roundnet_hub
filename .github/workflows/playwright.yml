name: Playwright tests

on:
  workflow_call:
  # TEMPORARY: run the suite on the fix branch while the specs are being updated. Remove before merging.
  push:
    branches: [claude/fervent-noether-uu60ja]

jobs:
  playwright-tests:
    name: "E2E (Playwright)"
    # Pinned: ubuntu-latest is now 26.04, which Playwright 1.59's `install --with-deps`
    # cannot provision system deps for ("does not support chromium on ubuntu26.04-x64").
    runs-on: ubuntu-24.04
    # Blocking: a failing e2e test fails this check, and on production the Production workflow
    # does not migrate or deploy (required checks need a paid plan for private repos, so the
    # deploy is gated instead of the merge). The README/report steps below still run (if: always()).
    # contents: write — the run commits the recalculated README test-status table back to the
    # PR branch (pushes made with GITHUB_TOKEN never trigger another workflow run).
    permissions:
      contents: write
    env:
      E2E_COVERAGE: 'true'
      # Shown in the README table: the PR's head commit, not GitHub's temporary merge commit.
      E2E_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # On PRs check out the branch itself (not the merge ref) so the README can be pushed.
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      # Local Supabase stack (same proven steps as the db-test job). Brings up the DB,
      # auth (GoTrue) and API gateway on :54321 that the app and the specs talk to.
      # Pinned: "latest" makes setup-cli query the GitHub API on every run, which fails under
      # rate limiting ("Failed to resolve latest Supabase CLI release") before any test runs.
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      # Expose the app's API schemas (games, notifications, util) like production does.
      - name: Use the e2e Supabase config
        run: test -f supabase/config.toml || cp e2e/supabase.config.toml supabase/config.toml
      - run: supabase start --ignore-health-check
      # Storage policies exist only in the production dashboard, not in the repo — give the local
      # stack the minimum the app needs (own-folder access in the `user` bucket) for upload tests.
      - name: Apply e2e storage policies
        run: docker exec -i supabase_db_roundnet_karlsruhe_app psql -U postgres -v ON_ERROR_STOP=1 -q < e2e/storage-policies.sql

      - name: Export local stack env for app + tests
        run: |
          supabase status -o env > .supabase-status.env
          set -a; . ./.supabase-status.env; set +a
          {
            echo "VITE_SUPABASE_URL=${API_URL}"
            echo "SUPABASE_URL=${API_URL}"
            echo "VITE_SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "VITE_SUPABASE_PROJECT_ID=local"
            echo "VITE_WEBSITE_NAME=Roundnet Karlsruhe"
            echo "VITE_WEBSITE_PATH=roundnet-karlsruhe"
            echo "VITE_ICON_PREFIX=roundnet-karlsruhe"
            echo "VITE_ENV=development"
            echo "TEST_USER_PASSWORD=password"
            echo "BASE_URL=http://localhost:5173"
          } >> "$GITHUB_ENV"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # playwright.config.ts starts the Vite dev server (yarn start) itself via webServer.
      # Reporters come from playwright.config.ts (list + html + json → test-results/results.json).
      - name: Run Playwright tests
        run: npx playwright test

      - name: Recalculate README test status
        if: always()
        run: |
          npx nyc report --reporter=json-summary --reporter=text-summary --report-dir=coverage/e2e || true
          node scripts/e2e-report.mjs
          node scripts/e2e-report.mjs --stdout >> "$GITHUB_STEP_SUMMARY" || true

      - name: Commit README test status to the PR branch
        # Only for PRs into production: stacked PRs would each rewrite the same generated block
        # and conflict with one another (they still get the table in the job summary).
        if: always() && github.event_name == 'pull_request' && github.base_ref == 'production' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git diff --quiet README.md && { echo "README unchanged"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(readme): E2E-Teststatus aktualisiert [skip ci]"
          # The branch may have moved while the tests ran; never clobber newer commits.
          git pull --rebase origin "${{ github.head_ref }}" && git push origin "HEAD:${{ github.head_ref }}" || echo "::warning::README push skipped (branch moved)"

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            coverage/e2e
          retention-days: 7
