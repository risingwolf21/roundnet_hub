name: Backup

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 */3 * *' # Runs every day at midnight

jobs:
  backup-karlsruhe:
    name: Backup Roundnet Karlsruhe
    runs-on: ubuntu-latest
    environment: 'Roundnet Karlsruhe'
    steps:
      - uses: actions/checkout@v4
      
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump Karlsruhe (full/roles/schema/data)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_CONNECTION_STRING }} # For example: postgresql://postgres:[YOUR-PASSWORD]@db.<ref>.supabase.co:5432/postgres
        run: |
          supabase db dump --db-url "$SUPABASE_DB_URL" -f supabase/backup/roundnet-karlsruhe/full_dump.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f supabase/backup/roundnet-karlsruhe/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f supabase/backup/roundnet-karlsruhe/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f supabase/backup/roundnet-karlsruhe/data.sql --data-only --use-copy

      - name: Set DATE env (Europe/Berlin)
        run: echo "DATE=$(TZ=Europe/Berlin date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Determine CHOICE for commit message
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            choice="${{ github.event.inputs.publish }}"
          else
            choice="All"
          fi
          echo "CHOICE=$choice" >> $GITHUB_ENV

      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "📦 Supabase Backup (${{ env.CHOICE }}) ${{ env.DATE }}"
          file_pattern: |
            supabase/backup/roundnet-karlsruhe/*
            supabase/backup/munich-roundnet/*

  backup-munich:
    name: Backup Munich roundnet
    needs: backup-karlsruhe
    runs-on: ubuntu-latest
    environment: 'Munich Roundnet'
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump Munich (full/roles/schema/data)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_CONNECTION_STRING }} # For example: postgresql://postgres:[YOUR-PASSWORD]@db.<ref>.supabase.co:5432/postgres
        run: |
          supabase db dump --db-url "$SUPABASE_DB_URL" -f supabase/backup/munich-roundnet/full_dump.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f supabase/backup/munich-roundnet/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f supabase/backup/munich-roundnet/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f supabase/backup/munich-roundnet/data.sql --data-only --use-copy

      - name: Set DATE env (Europe/Berlin)
        run: echo "DATE=$(TZ=Europe/Berlin date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Determine CHOICE for commit message
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            choice="${{ github.event.inputs.publish }}"
          else
            choice="All"
          fi
          echo "CHOICE=$choice" >> $GITHUB_ENV

      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "📦 Supabase Backup (${{ env.CHOICE }}) ${{ env.DATE }}"
          file_pattern: |
            supabase/backup/roundnet-karlsruhe/*
            supabase/backup/munich-roundnet/*