name: Production without Artifacts
"on":
  workflow_dispatch:
    inputs:
      publish:
        description: "Choose wich environment you would like to publish"
        required: true
        default: All
        type: choice
        options:
          - Munich Roundnet
          - Roundnet Karlsruhe
          - All
env:
  CI: ""

jobs:
  db-test:
    name: "Test database"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - run: supabase test db
      - run: supabase db lint --schema public,util,notificiations,games --fail-on error

  karlsruhe:
    name: "Build Karlsruhe"
    if: ${{ github.event_name != 'workflow_dispatch'
      || github.event.inputs.publish == 'All'
      || github.event.inputs.publish == 'Roundnet Karlsruhe' }}
    runs-on: ubuntu-latest
    needs: db-test
    environment:
      name: "Roundnet Karlsruhe"
      url: ${{ vars.PUBLIC_URL }}

    steps:
      - uses: actions/checkout@v2

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn run build:karlsruhe
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_DB_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          VITE_OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VITE_PAYPAL_ME_LINK: ${{ vars.PAYPAL_ME_LINK }}
          VITE_PAYMENT_INFO: ${{ vars.PAYMENT_INFO }}
          VITE_GIT_COMMIT: ${{ github.sha}}
          VITE_ENV: "production"

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROUNDNET_KARLSRUHE }}"
          channelId: live
          projectId: ${{ vars.FIREBASE_PROJECT }}
          target: ${{ vars.FIREBASE_TARGET }}

  munich:
    name: "Build Munich Roundnet"
    if: ${{ github.event_name != 'workflow_dispatch'
      || github.event.inputs.publish == 'All'
      || github.event.inputs.publish == 'Munich Roundnet' }}
    runs-on: ubuntu-latest
    needs: db-test
    environment:
      name: "Munich Roundnet"
      url: ${{ vars.PUBLIC_URL }}

    steps:
      - uses: actions/checkout@v2

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn run build:munich
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_DB_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          VITE_OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VITE_PAYPAL_ME_LINK: ${{ vars.PAYPAL_ME_LINK }}
          VITE_GIT_COMMIT: ${{ github.sha}}
          VITE_ENV: "production"

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROUNDNET_KARLSRUHE }}"
          channelId: live
          projectId: ${{ vars.FIREBASE_PROJECT }}
          target: ${{ vars.FIREBASE_TARGET }}
