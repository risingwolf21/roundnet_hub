name: Supabase Production Backup

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight
jobs:   
  run_db_backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      supabase_prod_db_url: ${{ secrets.SUPABASE_PRODUCTION_URL }}   # For example: postgresql://postgres:[YOUR-PASSWORD]@db.<ref>.supabase.co:5432/postgres
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}
      - uses: supabase/setup-cli@v1
        with:
          version: latest
          
      - name: Full Backup (schema)
        run: supabase db dump --schema public,games,permissions,logs --db-url "$supabase_prod_db_url" -f supabase/backup/full_dump.sql

      - name: Full Backup (roles)
        run: supabase db dump --schema public,games,permissions,logs --db-url "$supabase_prod_db_url" -f supabase/backup/full_dump_roles.sql --roles-only

      - name: Full Backup (data)
        run: supabase db dump --schema public,games,permissions,logs --db-url "$supabase_prod_db_url" -f supabase/backup/full_dump_data.sql --data-only

      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Supabase Backup $(date +'%Y-%m-%d')"
          file_pattern: supabase/backup/*
          
      - uses: actions/upload-artifact@v4
        with:
          name: backup
          path: supabase/backup
  
  restore_to_other_db:
    runs-on: ubuntu-latest
    needs: run_db_backup
    env:
      supabase_staging_db_url: ${{ secrets.SUPABASE_STAGING_URL }}
    steps:
      - uses: actions/checkout@v3

      - uses: actions/download-artifact@v4
        with:
          name: backup
          path: supabase/backup

      - name: Install PostgreSQL client
        run: sudo apt-get install postgresql-client -y

      - name: Wipe staging DB
        run: psql "$supabase_staging_db_url" -f supabase/backup/wipe.sql

      - name: Restore schema to staging DB
        run: psql "$supabase_staging_db_url" < supabase/backup/full_dump.sql
        
      - name: Restore roles to staging DB
        run: psql "$supabase_staging_db_url" < supabase/backup/full_dump_roles.sql
        
      - name: Restore data to staging DB
        run: psql "$supabase_staging_db_url" < supabase/backup/full_dump_data.sql
  
    
