name: Check on master and production branch
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - production
env:
  CI: ""

jobs:
  db-test:
    name: "Test database"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start --ignore-health-check
      - run: supabase test db
      - run: supabase db lint --schema public,util,notifications,games --fail-on error

  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          VITE_ENV: development
          VITE_SHORT_NAME: "Roundnet Karlsruhe"
          VITE_THEME_COLOR: "#0e876c"
          VITE_BG_COLOR: "#0e876c"
          VITE_ICON_PREFIX: "roundnet-karlsruhe"
          VITE_WEBSITE_PATH: "roundnet-karlsruhe"
          VITE_WEBSITE_NAME: "Roundnet Localhost"
          VITE_PUBLIC_URL: "http://localhost:5173"
