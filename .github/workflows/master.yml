name: Checks on master branch
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
env:
  CI: ""

jobs:
  db-test:
    name: "Test database"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - run: supabase test db
      - run: supabase db lint --schema public,util,notificiations,games --fail-on error