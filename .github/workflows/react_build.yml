name: Building
on:
  push:
    branches-ignore:
      - production
jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: yarn install
        
      - name: Test
        run: yarn test

      - name: Build
        run: yarn build --openssl-legacy-provider

      - name: Deploying to Staging Environment
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROUNDNET_KARLSRUHE }}'
          channelId: live
          projectId: roundnet-karlsruhe
          target: staging
