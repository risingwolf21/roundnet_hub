name: Building
on:
  push:
    branches-ignore:
      - production
jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: yarn install
        
      - name: Test
        run: yarn test

      - name: Write commit Version to file
        run: |
          touch src/git_commit.txt
          echo ${GITHUB_SHA} >> src/git_commit.txt

      - name: Build
        run: yarn build --openssl-legacy-provider
