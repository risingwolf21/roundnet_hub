name: Staging Roundnet Karlsruhe
on:
  push:
    branches:
      - staging

env:
  CI: ''

jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    environment: 'Roundnet Karlsruhe'
    steps:
      - uses: actions/checkout@v2

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: yarn install

      - name: Build
        run: yarn run build:staging
        env:
          PUBLIC_URL: 'https://staging-roundnet-karlsruhe.web.app'
          REACT_APP_SUPABASE_API_KEY: ${{secrets.RK_STAGING_ANON_KEY}}
          REACT_APP_SUPABASE_URL: ${{secrets.RK_STAGING_URL}}
          REACT_APP_PAYPAL_ME_LINK: ${{secrets.RK_PRODUCTION_PAYPAL_ME_LINK}}

      - name: Deploying to Staging Environment
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROUNDNET_KARLSRUHE }}'
          channelId: live
          projectId: roundnet-karlsruhe
          target: staging
