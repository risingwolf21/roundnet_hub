name: Munich Roundnet Backup

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 */3 * *' # Runs every day at midnight
jobs:
  run_db_backup:
    runs-on: ubuntu-latest
    environment: 'Munich Roundnet'
    permissions:
      contents: write
    env:
      supabase_prod_db_url: ${{ secrets.PRODUCTION_CONNECTION_STRING }} # For example: postgresql://postgres:[YOUR-PASSWORD]@db.<ref>.supabase.co:5432/postgres
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Full Backup (roles, schema & data)
        run: supabase db dump --db-url "$supabase_prod_db_url" -f supabase/backup/munich-roundnet/full_dump.sql
      - name: Backup roles
        run: supabase db dump --db-url "$supabase_prod_db_url" -f supabase/backup/munich-roundnet/roles.sql --role-only
      - name: Backup schema
        run: supabase db dump --db-url "$supabase_prod_db_url" -f supabase/backup/munich-roundnet/schema.sql
      - name: Backup data
        run: supabase db dump --db-url "$supabase_prod_db_url" -f supabase/backup/munich-roundnet/data.sql --data-only --use-copy

      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Munich Roundnet Supabase Backup $(date +'%Y-%m-%d')"
          file_pattern: supabase/backup/munich-roundnet/*

      - uses: actions/upload-artifact@v4
        with:
          name: backup
          path: supabase/backup/munich-roundnet

  restore_to_other_db:
    runs-on: ubuntu-latest
    needs: run_db_backup
    environment: 'Munich Roundnet'
    env:
      supabase_staging_db_url: ${{ secrets.STAGING_CONNECTION_STRING }}
    steps:
      - uses: actions/checkout@v3

      - uses: actions/download-artifact@v4
        with:
          name: backup
          path: supabase/munich-roundnet/backup

      - name: Install PostgreSQL client
        run: sudo apt-get install postgresql-client -y

      - name: Wipe staging DB
        run: psql "$supabase_staging_db_url" -f supabase/backup/munich-roundnet/wipe.sql

      - name: Restore to staging DB
        run: psql "$target_db_url" < supabase/backup/munich-roundnet/full_dump.sql
