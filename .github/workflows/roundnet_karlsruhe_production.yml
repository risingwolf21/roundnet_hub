name: Production Roundnet Karlsruhe
'on':
  push:
    branches:
      - production
env:
  CI: ''

jobs:
  build_and_deploy_production:
    runs-on: ubuntu-latest
    environment: 'Roundnet Karlsruhe'
    steps:
      - uses: actions/checkout@v2

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - name: Output env vars
        run: |
          echo "KEY: $REACT_APP_SUPABASE_API_KEY"
          echo "URL: $REACT_APP_SUPABASE_URL"
          echo "PAYPAL: $REACT_APP_PAYPAL_ME_LINK"
        env:
          REACT_APP_SUPABASE_API_KEY: ${{ secrets.PRODUCTION_ANON_KEY }}
          REACT_APP_SUPABASE_URL: ${{ secrets.PRODUCTION_URL }}
          REACT_APP_PAYPAL_ME_LINK: ${{ secrets.PRODUCTION_PAYPAL_ME_LINK }}

      - name: Install dependencies
        run: yarn install

      - name: Write commit Version to file
        uses: DamianReeves/write-file-action@master
        with:
          path: ${{github.workspace}}/public/git_commit.txt
          contents: |
            ${{github.sha}}
          write-mode: overwrite

      - name: Build
        run: yarn run build:production
        env:
          PUBLIC_URL: 'https://roundnet-karlsruhe.web.app'
          REACT_APP_SUPABASE_API_KEY: ${{secrets.PRODUCTION_ANON_KEY}}
          REACT_APP_SUPABASE_URL: ${{secrets.PRODUCTION_URL}}
          REACT_APP_PAYPAL_ME_LINK: ${{secrets.PRODUCTION_PAYPAL_ME_LINK}}

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROUNDNET_KARLSRUHE }}'
          channelId: live
          projectId: roundnet-karlsruhe
          target: production
