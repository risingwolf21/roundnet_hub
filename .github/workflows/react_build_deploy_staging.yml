name: Staging
on:
  push:
    branches:
      - staging
      - master

env:
  CI: ''

jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: yarn install

      - name: Write commit Version to file
        uses: DamianReeves/write-file-action@master
        with:
          path: ${{github.workspace}}/src/git_commit.txt
          contents: |
            ${{github.sha}}
          write-mode: overwrite

      - name: 'Write firebase service worker config file'
        run: yarn run build-fcm-config

      - name: Build
        run: PUBLIC_URL=https://staging-roundnet-karlsruhe.web.app yarn run build:staging
        env:
          REACT_APP_SUPABASE_API_KEY: ${{secrets.SUPABASE_STAGING_ANON_KEY}}
          REACT_APP_SUPABASE_URL: ${{secrets.SUPABASE_STAGING_URL}}

      - name: Deploy to staging environment
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROUNDNET_KARLSRUHE }}'
          channelId: live
          projectId: roundnet-karlsruhe
          target: staging
