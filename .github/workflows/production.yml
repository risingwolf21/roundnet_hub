name: Production
'on':
  workflow_dispatch:
    inputs:
      publish:
        description: 'Choose wich environment you would like to publish'
        required: true
        default: All
        type: choice
        options:
          - Munich Roundnet
          - Roundnet Karlsruhe
          - All
  push:
    branches:
      - production
env:
  CI: ''

jobs:
  setup:
    name: 'Setup'
    runs-on: ubuntu-latest
    environment:
      name: 'Roundnet Karlsruhe'
    steps:
      - uses: actions/checkout@v2

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Write commit Version to file
        uses: DamianReeves/write-file-action@master
        with:
          path: ${{github.workspace}}/public/git_commit.txt
          contents: |
            ${{github.sha}}
          write-mode: overwrite

      - uses: actions/upload-artifact@v4
        with:
          name: git-commit-version
          path: ${{github.workspace}}/public/git_commit.txt


  db-test:
    name: "Test database"
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v3
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - run: supabase test db

  build:
    strategy:
      fail-fast: false
      matrix:
        env:
          - { name: 'Roundnet Karlsruhe', mode: karlsruhe, firebase_project: roundnet-karlsruhe, firebase_target: production }
          - { name: 'Munich Roundnet',    mode: munich,    firebase_project: roundnet-karlsruhe, firebase_target: munich-roundnet-production }

    name: 'Build: ${{matrix.env.name}}'
    if: ${{ inputs.publish == 'All' || inputs.publish == matrix.env.name }}
    runs-on: ubuntu-latest
    needs: db-test

    environment:
      name: ${{ matrix.env.name }}
      url: ${{ vars.PUBLIC_URL }}

    steps:
      - uses: actions/checkout@v2

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - name: Restore node_modules cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - uses: actions/download-artifact@v4
        with:
          name: git-commit-version
          path: ${{github.workspace}}/public

      - name: Build
        run: yarn build --mode ${{ matrix.env.mode }}
        env:
          VITE_PUBLIC_URL:            ${{ vars.PUBLIC_URL }}
          VITE_WEBSITE_NAME:          ${{ vars.WEBSITE_NAME }}
          VITE_SHORT_NAME:            ${{ vars.SHORT_NAME }}
          VITE_THEME_COLOR:           ${{ vars.THEME_COLOR }}
          VITE_BG_COLOR:              ${{ vars.BG_COLOR }}
          VITE_ICON_PREFIX:           ${{ vars.ICON_PREFIX }}

          VITE_SUPABASE_URL:          ${{ vars.DB_URL }}
          VITE_SUPABASE_ANON_KEY:     ${{ secrets.PRODUCTION_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID:   ${{ vars.PROJECT_ID }}
          VITE_OPENWEATHER_API_KEY:   ${{ secrets.OPENWEATHER_API_KEY }}
          VITE_VAPID_PUBLIC_KEY:      ${{ vars.VAPID_PUBLIC_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: '${{ matrix.env.website_path }}-build'
          path: ${{github.workspace}}/build

  deploy:
    strategy:
      fail-fast: false
      matrix:
        env:
          - { name: 'Roundnet Karlsruhe', mode: karlsruhe, firebase_project: roundnet-karlsruhe, firebase_target: production }
          - { name: 'Munich Roundnet',    mode: munich,    firebase_project: roundnet-karlsruhe, firebase_target: munich-roundnet-production }
    runs-on: ubuntu-latest
    needs: build
    if: ${{ inputs.publish == 'All' || inputs.publish == matrix.env.name }}
    name: 'Deploy: ${{matrix.env.name}}'
    

    environment:
      name: ${{ matrix.env.name }}
      url:  ${{ vars.PUBLIC_URL }}

    steps:
      - uses: actions/checkout@v2

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - uses: actions/download-artifact@v4
        with:
          name: '${{ matrix.env.website_path }}-build'
          path: ${{github.workspace}}/build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROUNDNET_KARLSRUHE }}'
          channelId: live
          projectId: ${{ matrix.env.firebase_project }}
          target: ${{ matrix.env.firebase_target }}
