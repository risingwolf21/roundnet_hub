name: Production
'on':
  push:
    branches:
      - production
env:
  CI: ''

jobs:

  build_production:
    runs-on: ubuntu-latest
    needs: [checkout, node_setup, dependencies]
    steps:
      - uses: actions/checkout@v2

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: yarn install

      - name: Build
        run: PUBLIC_URL=https://roundnet-karlsruhe.web.app yarn run build:production
        env:
          REACT_APP_SUPABASE_API_KEY: ${{secrets.SUPABASE_PRODUCTION_ANON_KEY}}
          REACT_APP_SUPABASE_URL: ${{secrets.SUPABASE_PRODUCTION_URL}}
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/

  deploy-production:
    runs-on: ubuntu-latest
    needs: [build_production]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROUNDNET_KARLSRUHE }}'
          channelId: live
          projectId: roundnet-karlsruhe
          target: production

  build_admin:
    runs-on: ubuntu-latest
    needs: [checkout, node_setup, dependencies]
    steps:
      - uses: actions/checkout@v2

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: yarn install
        
      - name: Build
        run: PUBLIC_URL=https://roundnet-karlsruhe.web.app yarn run build:production_admin
        env:
          REACT_APP_SUPABASE_API_KEY: ${{secrets.SUPABASE_PRODUCTION_ANON_KEY}}
          REACT_APP_SUPABASE_URL: ${{secrets.SUPABASE_PRODUCTION_URL}}
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: build_admin/

  deploy-admin:
    runs-on: ubuntu-latest
    needs: [build_admin]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: build_admin
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROUNDNET_KARLSRUHE }}'
          channelId: live
          projectId: roundnet-karlsruhe
          target: production
