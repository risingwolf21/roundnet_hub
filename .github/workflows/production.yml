name: Production
'on':
  push:
    branches:
      - production
env:
  CI: ''

jobs:
  setup:
    name: 'Setup'
    runs-on: ubuntu-latest
    environment:
      name: 'Roundnet Karlsruhe'
    steps:
      - uses: actions/checkout@v2

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: yarn install

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Write commit Version to file
        uses: DamianReeves/write-file-action@master
        with:
          path: ${{github.workspace}}/public/git_commit.txt
          contents: |
            ${{github.sha}}
          write-mode: overwrite

      - name: Generate enum types for permission and feature
        run: yarn run generate:supabase-types:production
        env:
          REACT_APP_SUPABASE_API_KEY: ${{ secrets.PRODUCTION_ANON_KEY }}
          REACT_APP_SUPABASE_URL: ${{ vars.PRODUCTION_DB_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: git-commit-version
          path: ${{github.workspace}}/public/git_commit.txt

      - uses: actions/upload-artifact@v4
        with:
          name: supabase-generated-types
          path: ${{github.workspace}}/src/generated/supabase-types.ts

  build:
    name: 'Build: ${{matrix.env.name}}'
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix:
        env:
          - name: 'Roundnet Karlsruhe'
            firebase_target: production
            firebase_project: roundnet-karlsruhe
            firebase_url: https://roundnet-karlsruhe.web.app
            website_path: roundnet-karlsruhe
            website_manifest: manifest-roundnet-karlsruhe.json
            supabase_url_secret: PRODUCTION_DB_URL
            supabase_key_secret: PRODUCTION_ANON_KEY

          - name: 'Munich Roundnet'
            firebase_target: munich-roundnet-production
            firebase_project: roundnet-karlsruhe
            firebase_url: https://munich-roundnet.web.app
            website_path: munich-roundnet
            website_manifest: manifest-munich-roundnet.json
            supabase_url_secret: PRODUCTION_DB_URL
            supabase_key_secret: PRODUCTION_ANON_KEY

    environment:
      name: ${{ matrix.env.name }}
      url: ${{ matrix.env.firebase_url }}

    steps:
      - uses: actions/checkout@v2

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - name: Restore node_modules cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - uses: actions/download-artifact@v4
        with:
          name: git-commit-version
          path: ${{github.workspace}}/public/git_commit.txt

      - uses: actions/download-artifact@v4
        with:
          name: supabase-generated-types
          path: ${{github.workspace}}/src/generated/supabase-types.ts

      - name: Build
        run: yarn run build:production
        env:
          PUBLIC_URL: ${{ matrix.env.firebase_url }}
          REACT_APP_SUPABASE_API_KEY: ${{ secrets[matrix.env.supabase_key_secret] }}
          REACT_APP_SUPABASE_URL: ${{ vars[matrix.env.supabase_url_secret] }}
          REACT_APP_WEBSITE_PATH: ${{ matrix.env.website_path }}
          REACT_APP_MANIFEST_JSON: ${{ matrix.env.website_manifest }}
          REACT_APP_WEBSITE_NAME: ${{ matrix.env.name }}

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROUNDNET_KARLSRUHE }}'
          channelId: live
          projectId: ${{ matrix.env.firebase_project }}
          target: ${{ matrix.env.firebase_target }}

      - uses: actions/upload-artifact@v4
        with:
          name: '${{ matrix.env.website_path }}-build'
          path: ${{github.workspace}}/build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    name: 'Deploy: ${{matrix.env.name}}'
    strategy:
      matrix:
        env:
          - name: 'Roundnet Karlsruhe'
            firebase_target: production
            firebase_project: roundnet-karlsruhe
            firebase_url: https://roundnet-karlsruhe.web.app
            website_path: roundnet-karlsruhe

          - name: 'Munich Roundnet'
            firebase_target: munich-roundnet-production
            firebase_project: roundnet-karlsruhe
            firebase_url: https://munich-roundnet.web.app
            website_path: munich-roundnet

    environment:
      name: ${{ matrix.env.name }}
      url: ${{ matrix.env.firebase_url }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: '${{ matrix.env.website_path }}-build'
          path: ${{github.workspace}}/build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROUNDNET_KARLSRUHE }}'
          channelId: live
          projectId: ${{ matrix.env.firebase_project }}
          target: ${{ matrix.env.firebase_target }}
